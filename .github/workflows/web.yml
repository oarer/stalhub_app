name: CI and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_version:
        description: Skip creating a release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Serialize runs per ref so the version computed below cannot race with an
# in-flight release (electron-builder bakes the version into the artifacts).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/github-script@v7
        id: version
        with:
          script: |
            const { data: releases } = await github.paginate(
              github.rest.repos.listReleases,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const versions = releases
              .map(r => r.tag_name)
              .filter(t => /^v\d+\.\d+\.\d+$/.test(t))
              .map(t => t.slice(1).split('.').map(Number));
            versions.sort((a, b) =>
              b[0] - a[0] || b[1] - a[1] || b[2] - a[2]);
            const [major, minor, patch] = versions[0] || [0, 0, 0];
            let bump = 'patch';
            const latest = releases
              .filter(r => /^v\d+\.\d+\.\d+$/.test(r.tag_name))
              .sort((a, b) => new Date(b.published_at || b.created_at) - new Date(a.published_at || a.created_at))[0];
            if (latest) {
              const comparison = await github.rest.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: latest.tag_name,
                head: context.sha,
              });
              const messages = comparison.data.commits.map(c => c.commit.message);
              if (messages.some(m => /BREAKING CHANGE:|^[a-z]+!:/m.test(m))) bump = 'major';
              else if (messages.some(m => /^feat(?:\([^)]*\))?:/m.test(m))) bump = 'minor';
            }
            let next;
            if (bump === 'major') next = [major + 1, 0, 0];
            else if (bump === 'minor') next = [major, minor + 1, 0];
            else next = [major, minor, patch + 1];
            core.setOutput('tag', `v${next.join('.')}`);
            core.setOutput('version', next.join('.'));
            core.setOutput('bump', bump);

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:trading
      - run: bun run build
        env:
          STALHUB_API_ORIGIN: https://api.stalhub.dev

  electron:
    needs: [web, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
          - name: windows-x64
            os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run typecheck
      - name: Set app version
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.APP_VERSION;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
      - run: bun run build:web
        env:
          STALHUB_API_ORIGIN: https://api.stalhub.dev
      - run: bun run build:electron
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm
      - name: Package
        run: bunx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: stalhub-${{ matrix.name }}
          path: |
            out/*.exe
            out/*.AppImage
            out/*.deb
            out/*.rpm
            out/*.dmg
            out/*.zip
            out/latest*.yml
            out/*.blockmap
          if-no-files-found: error

  release:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip release]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.skip_version == false)
    needs: [web, electron, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: stalhub-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Stalhub ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: release-assets/**/*
