name: CI and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_version:
        description: Skip creating a release
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Serialize runs per ref so the version computed below cannot race with an
# in-flight release (tauri.conf.json bakes the version into the artifacts).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/github-script@v9
        id: version
        with:
          script: |
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );
            const versions = releases
              .map(r => r.tag_name)
              .filter(t => /^v\d+\.\d+\.\d+$/.test(t))
              .map(t => t.slice(1).split('.').map(Number));
            versions.sort((a, b) =>
              b[0] - a[0] || b[1] - a[1] || b[2] - a[2]);
            const [major, minor, patch] = versions[0] || [0, 0, 0];
            let bump = 'patch';
            const latest = releases
              .filter(r => /^v\d+\.\d+\.\d+$/.test(r.tag_name))
              .sort((a, b) => new Date(b.published_at || b.created_at) - new Date(a.published_at || a.created_at))[0];
            if (latest) {
              const comparison = await github.rest.repos.compareCommits({
                owner: context.repo.owner,
                repo: context.repo.repo,
                base: latest.tag_name,
                head: context.sha,
              });
              const messages = comparison.data.commits.map(c => c.commit.message);
              if (messages.some(m => /BREAKING CHANGE:|^[a-z]+!:/m.test(m))) bump = 'major';
              else if (messages.some(m => /^feat(?:\([^)]*\))?:/m.test(m))) bump = 'minor';
            }
            let next;
            if (bump === 'major') next = [major + 1, 0, 0];
            else if (bump === 'minor') next = [major, minor + 1, 0];
            else next = [major, minor, patch + 1];
            core.setOutput('tag', `v${next.join('.')}`);
            core.setOutput('version', next.join('.'));
            core.setOutput('bump', bump);

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test:trading
      - run: bun run build
        env:
          STALHUB_API_ORIGIN: https://api.stalhub.dev

  tauri:
    needs: [web, version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            bundles: deb appimage
          - name: windows-x64
            os: windows-latest
            bundles: nsis
          # macOS opt-in (needs a mac runner): uncomment to enable.
          # - name: macos-arm64
          #   os: macos-latest
          #   bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential curl wget file
          libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: web
      - name: Set app version
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.env.APP_VERSION;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');const t='src-tauri/Cargo.toml';let m=fs.readFileSync(t,'utf8');m=m.replace(/^version = \".*\"$/m,'version = \"'+process.env.APP_VERSION+'\"');fs.writeFileSync(t,m)"
      - name: Build web static export
        run: bun run build:export
        env:
          STALHUB_API_ORIGIN: https://api.stalhub.dev
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: src-tauri
          tauriScript: bunx tauri
          args: --bundles ${{ matrix.bundles }}
        env:
          # Updater artifacts (.sig/latest.json) are signed only when the key
          # is present; without it tauri-action builds unsigned bundles.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: tauri-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            # Всё из updater/: .sig, latest.json и архивы для скачивания
            # (nsis.zip / AppImage.tar.gz) — latest.json ссылается на них.
            src-tauri/target/release/bundle/updater/*
          if-no-files-found: error

  android:
    # Release-track: APK signing needs keystore secrets (checked in the
    # first step with a clear error). gen/android scaffold must be committed
    # (see the scaffold check below).
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    needs: [version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          cache: true
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: web
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Android Rust targets
        run: >
          rustup target add aarch64-linux-android
          armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
        with:
          # The deprecated `tools` SDK package was removed from Google's repository.
          packages: platform-tools
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
      - name: Check Android signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          [ -n "$KEYSTORE_BASE64" ] || { echo "::error::Missing secret ANDROID_KEYSTORE_BASE64"; missing=1; }
          [ -n "$KEYSTORE_PASSWORD" ] || { echo "::error::Missing secret ANDROID_KEYSTORE_PASSWORD"; missing=1; }
          [ -n "$KEY_ALIAS" ] || { echo "::error::Missing secret ANDROID_KEY_ALIAS"; missing=1; }
          [ -n "$KEY_PASSWORD" ] || { echo "::error::Missing secret ANDROID_KEY_PASSWORD"; missing=1; }
          exit $missing
      - name: Check Android project scaffold
        shell: bash
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            echo "::error::src-tauri/gen/android is missing. Run 'bun tauri android init' locally with the Android SDK/NDK and commit the scaffold (without keystores)."
            exit 1
          fi
      - name: Set app version
        shell: bash
        env:
          APP_VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const c=JSON.parse(fs.readFileSync(p,'utf8'));c.version=process.env.APP_VERSION;fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');const t='src-tauri/Cargo.toml';let m=fs.readFileSync(t,'utf8');m=m.replace(/^version = \".*\"$/m,'version = \"'+process.env.APP_VERSION+'\"');fs.writeFileSync(t,m)"
      - name: Build web static export
        run: bun run build:export
        env:
          STALHUB_API_ORIGIN: https://api.stalhub.dev
      - name: Decode keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/stalhub.keystore
      - name: Build Android packages
        shell: bash
        env:
          TAURI_ANDROID_KEYSTORE_PATH: /tmp/stalhub.keystore
          TAURI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TAURI_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAURI_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bunx tauri android build
      - name: Rename packages
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          apk=$(find src-tauri/gen/android/app/build/outputs/apk -name 'app-universal-release.apk' | head -1)
          aab=$(find src-tauri/gen/android/app/build/outputs/bundle -name 'app-universal-release.aab' | head -1)
          [ -n "$apk" ] || echo "::warning::signed APK missing (unsigned build?)"
          [ -n "$apk" ] && mv "$apk" "$(dirname "$apk")/stalhub-$VERSION-android.apk"
          [ -n "$aab" ] && mv "$aab" "$(dirname "$aab")/stalhub-$VERSION-android.aab"
      - uses: actions/upload-artifact@v7
        with:
          name: tauri-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/release/*.aab
          if-no-files-found: error

  release:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip release]')) ||
      (github.event_name == 'workflow_dispatch' && inputs.skip_version == false)
    needs: [web, tauri, android, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # Tauri desktop bundles + updater artifacts (.sig/latest.json) and
      # Android packages. Skipped jobs (e.g. android without secrets) are
      # simply absent here.
      - uses: actions/download-artifact@v8
        with:
          pattern: tauri-*
          path: release-assets
          merge-multiple: true
      # Манифест кастомного Android-апдейтера (update_android.rs): ищет
      # universal-APK среди артефактов и привязывает его к тегу. Без APK
      # (android-job пропущен) манифест не создаётся — десктопу он не нужен.
      - name: Generate Android update manifest
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          apk=$(find release-assets -name '*.apk' | grep -iE 'android|universal' | head -1)
          if [ -z "$apk" ]; then
            echo "No universal APK — skipping android-update.json"
            exit 0
          fi
          name=$(basename "$apk")
          node -e "const fs=require('fs');const m={version:process.env.VERSION,url:'https://github.com/oarer/stalhub_app/releases/download/'+process.env.TAG+'/'+process.argv[1]};fs.writeFileSync('release-assets/android-update.json',JSON.stringify(m,null,2)+'\n')" "$name"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Stalhub ${{ needs.version.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: release-assets/**/*
