[package]
name = "stalhub-installer"
version = "0.1.0"
edition = "2021"
links = "stalhub-installer"

[lib]
name = "stalhub_installer"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-plugin = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
