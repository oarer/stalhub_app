[package]
name = "stalhub"
version = "0.0.1"
description = "Stalhub desktop & mobile application"
authors = ["oarer"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["json", "http2", "multipart", "rustls-tls"] }
cookie_store = "0.21"
cookie = "0.18"
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = { version = "0.22", features = ["std"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-updater = "2"

# xcap не поддерживает Android (X11/CoreGraphics-only), остальное кроссплатформенно.
[target.'cfg(not(target_os = "android"))'.dependencies]
xcap = "0.2"
